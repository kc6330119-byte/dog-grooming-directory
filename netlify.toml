[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Force 301 from .html to extensionless (canonical URL cleanup).
# Prevents Google from indexing both /foo and /foo.html as separate URLs.
# IMPORTANT: These rules use placeholder syntax (:slug) instead of splats (*).
# Splats don't match when followed by a literal suffix like .html — placeholders do.
# These must come BEFORE the 200 pretty-URL rewrites below.

[[redirects]]
  from = "/groomer/:slug.html"
  to = "/groomer/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/state/:state_slug/:city_slug.html"
  to = "/state/:state_slug/:city_slug"
  status = 301
  force = true

[[redirects]]
  from = "/state/:slug.html"
  to = "/state/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/category/:slug.html"
  to = "/category/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug.html"
  to = "/blog/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/disclaimer.html"
  to = "/disclaimer"
  status = 301
  force = true

[[redirects]]
  from = "/editorial-standards.html"
  to = "/editorial-standards"
