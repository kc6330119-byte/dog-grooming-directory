[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Note: .html → extensionless 301 redirects live in dist/_redirects
# (generated by build.py). Placeholder interpolation in netlify.toml
# is unreliable for those rules; the _redirects file format works.

# Pretty URL rewrites (extensionless → .html, served as 200)
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/editorial-standards"
  to = "/editorial-standards.html"
  status = 200

# Newsletter feature retired 2026-05-24 (Mailchimp cancelled).
# Redirect old indexed newsletter URLs to home so Google drops them cleanly.
[[redirects]]
  from = "/newsletter/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/newsletter"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/category/mobile"
  to = "/category/mobile-grooming"
  status = 301
  force = true

[[redirects]]
  from = "/success"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/success/"
  to = "/success/index.html"
  status = 200
