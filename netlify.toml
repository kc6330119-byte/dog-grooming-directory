[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URL redirects
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/editorial-standards"
  to = "/editorial-standards.html"
  status = 200

[[redirects]]
  from = "/newsletter/archive"
  to = "/newsletter/archive.html"
  status = 200

[[redirects]]
  from = "/newsletter/sample"
  to = "/newsletter/sample.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/success/"
  to = "/success/index.html"
  status = 200

# Force 301 from .html to extensionless (canonical URL cleanup).
# Prevents Google from indexing both /foo and /foo.html as separate URLs.
[[redirects]]
  from = "/groomer/*.html"
  to = "/groomer/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/state/*/*.html"
  to = "/state/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/state/*.html"
  to = "/state/:splat"
  status = 301
  force = true

